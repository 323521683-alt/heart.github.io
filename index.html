<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>守护心力量 · 心理健康科普</title>
<style>
  :root{
    --stroke: rgba(255,255,255,.18);
    --text: #eef1ff;
    --muted: rgba(238,241,255,.62);
    --ease: cubic-bezier(.2,.8,.2,1);
  }

  *{ box-sizing: border-box; }

  html, body{ margin:0; padding:0; }

  body{
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: #06060f;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeSpeed;
  }

  /* ============ 背景光斑（改用径向渐变，零模糊滤镜） ============ */
  .bg{
    position: fixed; inset: 0; z-index: -2; overflow: hidden;
    background: #06060f;
  }
  .bg::before{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(1200px 700px at 12% -5%, rgba(27,32,80,.9) 0%, transparent 62%),
      radial-gradient(900px 620px at 88% 8%, rgba(45,17,66,.85) 0%, transparent 60%),
      radial-gradient(1100px 800px at 50% 108%, rgba(4,38,58,.85) 0%, transparent 62%);
  }

  .orb{
    position: absolute; border-radius: 50%;
    pointer-events: none;
    transform: translate3d(0,0,0);
    animation: float 26s ease-in-out infinite;
  }
  .o1{
    width: 900px; height: 900px; left:-260px; top:-340px; animation-duration:24s;
    background: radial-gradient(circle, rgba(59,91,255,.46) 0%, rgba(59,91,255,.14) 34%, transparent 68%);
  }
  .o2{
    width: 780px; height: 780px; right:-220px; top:-60px; animation-duration:29s; animation-delay:-9s;
    background: radial-gradient(circle, rgba(168,85,247,.42) 0%, rgba(168,85,247,.12) 36%, transparent 70%);
  }
  .o3{
    width: 1000px; height: 1000px; left:26%; bottom:-460px; animation-duration:33s; animation-delay:-15s;
    background: radial-gradient(circle, rgba(6,182,212,.36) 0%, rgba(6,182,212,.1) 36%, transparent 70%);
  }
  .o4{
    width: 720px; height: 720px; right:14%; bottom:-260px; animation-duration:27s; animation-delay:-5s;
    background: radial-gradient(circle, rgba(236,72,153,.34) 0%, rgba(236,72,153,.1) 36%, transparent 70%);
  }

  @keyframes float{
    0%,100%{ transform: translate3d(0,0,0); }
    33%    { transform: translate3d(46px,-34px,0); }
    66%    { transform: translate3d(-36px,32px,0); }
  }

  /* ============ 液态玻璃基础 ============ */
  .glass{
    position: relative;
    background: linear-gradient(140deg, rgba(255,255,255,.14), rgba(255,255,255,.04) 45%, rgba(255,255,255,.09));
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
    border: 1px solid var(--stroke);
    border-radius: 26px;
    box-shadow:
      0 20px 44px -14px rgba(0,0,0,.72),
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -20px 34px -24px rgba(130,175,255,.4);
    overflow: hidden;
    /* 关键：把重绘范围锁在元素内部 */
    contain: layout style paint;
  }

  /* 跟随鼠标的高光（仅在悬停时计算，rAF 节流） */
  .glass::before{
    content:"";
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(340px circle at var(--mx,50%) var(--my,50%),
                rgba(255,255,255,.2), rgba(255,255,255,.05) 42%, transparent 68%);
    opacity: 0;
    transition: opacity .3s ease;
  }
  .glass:hover::before,
  .glass:focus-visible::before{ opacity: 1; }

  /* 流动玻璃边缘：默认暂停，悬停才播放 */
  .glass::after{
    content:"";
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    border-radius: inherit;
    padding: 1px;
    background: linear-gradient(115deg,
      rgba(255,255,255,.85), rgba(255,255,255,0) 22%,
      rgba(255,255,255,0) 52%, rgba(140,190,255,.7) 74%, rgba(255,150,255,.65) 92%);
    background-size: 260% 260%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: sheen 9s linear infinite;
    animation-play-state: paused;
    opacity: .8;
  }
  .glass:hover::after,
  .glass:focus-visible::after{ animation-play-state: running; }

  @keyframes sheen{
    0%  { background-position: 0% 50%; }
    100%{ background-position: 200% 50%; }
  }

  /* ============ 顶部 ============ */
  .hero{
    max-width: 900px;
    margin: 0 auto;
    padding: 92px 26px 54px;
    text-align: center;
    position: relative;
  }
  .badge{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px; border-radius: 999px;
    font-size: 13px; letter-spacing: .08em; color: rgba(238,241,255,.82);
    background: linear-gradient(140deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.2);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 10px 26px -14px rgba(0,0,0,.8);
  }
  .badge i{
    width: 7px; height: 7px; border-radius: 50%; background: #6ee7b7;
    box-shadow: 0 0 12px #6ee7b7; animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  h1{
    font-size: clamp(42px, 8vw, 78px);
    margin: 26px 0 18px;
    letter-spacing: .04em;
    font-weight: 800;
    line-height: 1.08;
  }
  h1 .grad{
    background: linear-gradient(115deg, #8ab4ff 0%, #c9a6ff 45%, #7ef0e0 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .hero p{
    font-size: 16px; line-height: 1.9; color: var(--muted);
    max-width: 640px; margin: 0 auto;
  }

  /* ============ 卡片网格 ============ */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
    gap: 22px;
    max-width: 1220px;
    margin: 0 auto;
    padding: 0 26px 90px;
  }

  .card{
    padding: 26px 24px 20px;
    display: flex; flex-direction: column; gap: 12px;
    cursor: pointer;
    min-height: 262px;
    /* 只过渡 transform，走合成器 */
    transition: transform .38s var(--ease);
    animation: cardIn .6s var(--ease) backwards;
    outline: none;
  }
  @keyframes cardIn{
    from{ opacity: 0; transform: translate3d(0,24px,0); }
    to  { opacity: 1; transform: translate3d(0,0,0); }
  }

  .card:hover, .card:focus-visible{
    transform: translate3d(0,-8px,0);
    /* box-shadow 不做过渡，避免逐帧重绘阴影 */
    box-shadow:
      0 32px 62px -18px rgba(0,0,0,.85),
      0 0 0 1px rgba(255,255,255,.2),
      0 0 70px -22px var(--accent);
  }
  .card:active{ transform: translate3d(0,-3px,0) scale(.99); }

  .card > *:not(.blob){ position: relative; z-index: 2; }

  /* 装饰光斑：纯径向渐变，无 filter、无 SVG 滤镜 */
  .blob{
    position: absolute; z-index: 0;
    width: 240px; height: 240px; right: -72px; top: -84px;
    border-radius: 50%;
    opacity: .34;
    transition: transform .7s var(--ease), opacity .4s ease;
    pointer-events: none;
    transform: translate3d(0,0,0);
  }
  .card:hover .blob{
    transform: translate3d(-14px, 16px, 0) scale(1.22);
    opacity: .6;
  }

  .card-icon{
    width: 52px; height: 52px; border-radius: 17px;
    display: grid; place-items: center;
    font-size: 24px; line-height: 1;
    background: linear-gradient(140deg, rgba(255,255,255,.24), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.26);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 10px 22px -14px rgba(0,0,0,.9);
    transition: box-shadow .3s ease, transform .3s var(--ease);
  }
  .card:hover .card-icon{
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 0 26px -4px var(--accent);
    transform: translate3d(0,-2px,0);
  }

  .card h3{ margin: 2px 0 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; }
  .card .en{
    margin: 3px 0 0; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: rgba(238,241,255,.4);
  }
  .card .summary{
    margin: 2px 0 0; font-size: 14px; line-height: 1.75;
    color: rgba(238,241,255,.7); flex: 1;
  }

  .card-foot{
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-top: 6px;
  }
  .tag{
    display: inline-block; padding: 5px 12px; border-radius: 999px;
    font-size: 11.5px; letter-spacing: .04em;
    color: rgba(238,241,255,.82);
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.16);
    white-space: nowrap;
  }
  .hint{
    font-size: 12.5px; color: rgba(238,241,255,.5);
    display: inline-flex; align-items: center; gap: 5px;
    transition: color .3s ease;
  }
  .hint i{ font-style: normal; transition: transform .3s var(--ease); }
  .card:hover .hint{ color: var(--accent); }
  .card:hover .hint i{ transform: translate3d(4px,0,0); }

  .card.danger{
    border-color: rgba(255,90,120,.4);
    background: linear-gradient(140deg, rgba(255,90,120,.18), rgba(255,255,255,.04) 55%, rgba(255,255,255,.08));
  }

  /* ============ 弹窗 ============ */
  .overlay{
    position: fixed; inset: 0; z-index: 100;
    display: grid; place-items: center;
    padding: 24px;
    background: rgba(4,4,12,.55);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
  }
  .overlay.open{ opacity: 1; pointer-events: auto; }

  .modal{
    width: min(740px, 100%);
    max-height: min(86vh, 880px);
    display: flex; flex-direction: column;
    border-radius: 28px;
    transform: translate3d(0,18px,0) scale(.94);
    transition: transform .36s var(--ease);
  }
  .overlay.open .modal{ transform: translate3d(0,0,0) scale(1); }

  .modal-head{
    display: flex; align-items: center; gap: 14px;
    padding: 24px 26px 18px;
    border-bottom: 1px solid rgba(255,255,255,.09);
    position: relative; z-index: 4;
  }
  .modal-head .card-icon{ width: 54px; height: 54px; font-size: 25px; flex: 0 0 auto; }
  .modal-head h2{ margin: 0; font-size: 23px; letter-spacing: .03em; }
  .modal-head .en{
    margin: 3px 0 0; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: rgba(238,241,255,.42);
  }
  .modal-head .tag{ margin-left: auto; }

  .modal-close{
    flex: 0 0 auto;
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 14px; color: rgba(238,241,255,.75);
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.2);
    cursor: pointer;
    transition: background .22s ease, transform .22s var(--ease), color .22s ease;
  }
  .modal-close:hover{ background: rgba(255,255,255,.2); color:#fff; transform: rotate(90deg); }

  .modal-body{
    padding: 22px 26px 8px;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    position: relative; z-index: 4;
  }
  .modal-body::-webkit-scrollbar{ width: 8px; }
  .modal-body::-webkit-scrollbar-thumb{ background: rgba(255,255,255,.16); border-radius: 8px; }
  .modal-body::-webkit-scrollbar-track{ background: transparent; }

  .modal-body h4{
    display: flex; align-items: center; gap: 9px;
    margin: 6px 0 14px; font-size: 14px; letter-spacing: .1em;
    color: rgba(238,241,255,.72); font-weight: 600;
  }
  .modal-body h4 .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent, #8ab4ff);
    box-shadow: 0 0 14px var(--accent, #8ab4ff);
  }
  .modal-body section{ margin-bottom: 26px; }

  .signs{ list-style: none; margin: 0; padding: 0; }
  .signs li{
    position: relative; padding-left: 20px; margin-bottom: 10px;
    font-size: 14.5px; line-height: 1.75; color: rgba(238,241,255,.82);
  }
  .signs li::before{
    content:""; position: absolute; left: 3px; top: 9px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent, #8ab4ff);
    box-shadow: 0 0 10px var(--accent, #8ab4ff);
  }

  .tips{ list-style: none; margin: 0; padding: 0; }
  .tips li{
    display: flex; gap: 13px; padding: 14px 0;
    border-bottom: 1px dashed rgba(255,255,255,.09);
  }
  .tips li:last-child{ border-bottom: none; }
  .tips .num{
    flex: 0 0 27px; height: 27px; border-radius: 9px;
    display: grid; place-items: center;
    font-size: 12.5px; font-weight: 700; color: #fff;
    background: linear-gradient(140deg, rgba(255,255,255,.22), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
  }
  .tips b{ display: block; font-size: 15px; margin-bottom: 5px; font-weight: 600; }
  .tips p{ margin: 0; font-size: 14px; line-height: 1.75; color: rgba(235,240,255,.7); }

  .alert{
    margin: 4px 0 10px; padding: 16px 18px; border-radius: 16px;
    font-size: 14px; line-height: 1.75; color: #ffd9e2;
    background: linear-gradient(135deg, rgba(255,80,110,.2), rgba(255,80,110,.06));
    border: 1px solid rgba(255,120,150,.35);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }

  .modal-foot{
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 14px 22px 20px;
    border-top: 1px solid rgba(255,255,255,.08);
    position: relative; z-index: 4;
  }
  .nav-btn{
    padding: 9px 16px; border-radius: 999px;
    font-size: 13px; color: rgba(238,241,255,.85);
    background: linear-gradient(140deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.2);
    cursor: pointer;
    font-family: inherit;
    transition: background .22s ease, transform .22s var(--ease);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
  }
  .nav-btn:hover{
    background: linear-gradient(140deg, rgba(255,255,255,.28), rgba(255,255,255,.1));
    transform: translate3d(0,-2px,0);
  }
  .nav-btn:active{ transform: translate3d(0,0,0); }
  .counter{ font-size: 12.5px; color: rgba(238,241,255,.5); letter-spacing: .08em; }

  /* ============ 页脚 ============ */
  footer{
    max-width: 900px;
    margin: 0 auto;
    padding: 0 26px 70px;
    text-align: center;
    font-size: 12.5px;
    line-height: 1.9;
    color: rgba(238,241,255,.38);
  }
  footer strong{ color: rgba(238,241,255,.62); font-weight: 600; }

  /* ============ 响应式 & 降级 ============ */
  @media (max-width: 768px){
    .orb{ animation: none; }
    .glass{ -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); }
    .glass::after{ animation: none; }
  }

  @media (max-width: 560px){
    .hero{ padding: 66px 20px 40px; }
    .grid{ padding: 0 18px 70px; gap: 16px; }
    .card{ min-height: 0; padding: 22px 20px 18px; }
    .overlay{ padding: 12px; }
    .modal{ border-radius: 22px; max-height: 90vh; }
    .modal-head{ padding: 20px 18px 15px; gap: 11px; }
    .modal-head h2{ font-size: 19px; }
    .modal-body{ padding: 18px 18px 6px; }
    .modal-foot{ padding: 12px 16px 16px; }
    .nav-btn{ padding: 8px 12px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="orb o1"></span>
  <span class="orb o2"></span>
  <span class="orb o3"></span>
  <span class="orb o4"></span>
</div>

<header class="hero">
  <div class="badge"><i></i>心理健康科普 · 科学 · 温柔 · 可操作</div>
  <h1>守护<span class="grad">心力量</span></h1>
  <p>了解它，才不会被它吓到。点击下面任意一张玻璃卡片，打开属于它的独立窗口——看看那些真实存在的症状，以及今天就能开始的调整方法。</p>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <strong>温馨提示</strong>：本页内容为心理健康科普，不能替代专业诊断与治疗。<br>
  如果你长期被情绪或身体症状困扰，请前往正规医院精神心理科就诊。<br>
  全国心理援助热线：<strong>12356</strong>
</footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal glass" id="modal"></div>
</div>

<script>
/* ==================== 数据 ==================== */
const conditions = [
  {
    icon:'🌧️', name:'抑郁症', en:'Major Depressive Disorder', tag:'情绪障碍', color:'#6d8dff',
    summary:'持续两周以上的情绪低落与兴趣减退，是一种疾病，而不是“想太多”。',
    signs:[
      '几乎每天大部分时间情绪低落、空虚，或莫名烦躁易怒',
      '对以前喜欢的事情失去兴趣，体验不到快乐',
      '精力明显下降，起床、洗漱都像在搬一座山',
      '睡眠与食欲改变：失眠或嗜睡，暴食或毫无胃口',
      '注意力涣散、强烈自责，觉得自己“没有价值”'
    ],
    tips:[
      { t:'先稳住节律，再谈改变', d:'情绪最难控制的时候，先控制作息。每天同一时间起床，起床后见 15 分钟自然光，能帮助重置生物钟。' },
      { t:'把目标缩小到“能完成”', d:'不要要求自己“赶紧好起来”，只要求“今天洗个脸”“下楼走 10 分钟”。完成感本身就是药。' },
      { t:'记录，而不是反刍', d:'把想法写下来，在旁边标注一句：“这是症状在说话，不是事实。”写出来比在脑子里循环要轻得多。' },
      { t:'保留至少一条连接', d:'哪怕只是给一位朋友发一句“最近不太好”，也比完全断联更有保护作用。孤独会加重抑郁。' },
      { t:'该看医生就看医生', d:'中重度抑郁，药物治疗 + 心理治疗的有效率远高于硬扛。求助是能力，不是软弱。' }
    ],
    alert:'⚠️ 如果出现自伤、自杀的念头，请立刻告诉信任的人，不要独处，并拨打全国心理援助热线 12356（24 小时）。'
  },
  {
    icon:'😰', name:'广泛性焦虑', en:'Generalized Anxiety Disorder', tag:'焦虑障碍', color:'#ffb35c',
    summary:'对生活中各种事情长期过度担心，明知没必要，却停不下来。',
    signs:[
      '对工作、健康、家人、金钱等长期过度担忧，难以控制',
      '肌肉紧绷、肩颈酸痛、坐不住、容易受惊',
      '容易疲劳、注意力难以集中、烦躁易怒',
      '入睡困难、睡不安稳，醒来仍觉得累',
      '常伴随心慌、肠胃不适、出汗等身体反应'
    ],
    tips:[
      { t:'4-7-8 呼吸法', d:'吸气 4 秒，屏息 7 秒，缓慢呼气 8 秒，重复 4 轮。呼气比吸气长，能直接激活副交感神经。' },
      { t:'设置“担忧时间”', d:'每天固定 15 分钟专门用来担忧。其他时间冒出担忧，就写下来，留到那个时段再想。' },
      { t:'渐进式肌肉放松', d:'从脚趾到额头，逐组绷紧 5 秒再彻底放松 10 秒。身体松下来，大脑会收到“安全”的信号。' },
      { t:'减少咖啡因与酒精', d:'它们会直接放大心跳与警觉水平，让焦虑更容易被点燃。' },
      { t:'区分可控与不可控', d:'把担忧分成两栏，只对“我能做点什么”的那一栏列行动，另一栏练习放下。' }
    ]
  },

/* ==================== 环境检测 ==================== */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isCoarse = window.matchMedia('(pointer: coarse)').matches;
const enableGlow = !reduceMotion && !isCoarse;

/* ==================== 渲染卡片 ==================== */
const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
let currentIndex = -1;

const frag = document.createDocumentFragment();

conditions.forEach((c, i) => {
  const card = document.createElement('article');
  card.className = 'card glass' + (c.danger ? ' danger' : '');
  card.style.setProperty('--accent', c.color);
  card.style.animationDelay = (i * 40) + 'ms';
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', c.name + '，点击查看调整建议');

  card.innerHTML = `
    <div class="blob" style="background: radial-gradient(circle at 42% 42%, ${c.color} 0%, transparent 66%)"></div>
    <div class="card-icon">${c.icon}</div>
    <div>
      <h3>${c.name}</h3>
      <p class="en">${c.en}</p>
    </div>
    <p class="summary">${c.summary}</p>
    <div class="card-foot">
      <span class="tag">${c.tag}</span>
      <span class="hint">查看建议 <i>→</i></span>
    </div>
  `;

  card.addEventListener('click', () => openModal(i));
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openModal(i);
    }
  });

  if (enableGlow) {
    card.addEventListener('pointerenter', e => {
      activeCard = card;
      px = e.clientX; py = e.clientY;
      scheduleGlow();
    });
    card.addEventListener('pointerleave', () => {
      if (activeCard === card) activeCard = null;
    });
  }

  frag.appendChild(card);
});

grid.appendChild(frag);

/* ==================== 高光跟随（rAF 节流 + 事件委托） ==================== */
let activeCard = null;
let rafId = null;
let px = 0, py = 0;

function flushGlow(){
  rafId = null;
  if (!activeCard) return;
  const r = activeCard.getBoundingClientRect();
  activeCard.style.setProperty('--mx', (px - r.left) + 'px');
  activeCard.style.setProperty('--my', (py - r.top) + 'px');
}

function scheduleGlow(){
  if (rafId === null) rafId = requestAnimationFrame(flushGlow);
}

if (enableGlow) {
  grid.addEventListener('pointermove', e => {
    if (!activeCard) return;
    px = e.clientX; py = e.clientY;
    scheduleGlow();
  }, { passive: true });
}

/* ==================== 弹窗 ==================== */
function modalHTML(c, index){
  return `
    <div class="modal-head">
      <div class="card-icon">${c.icon}</div>
      <div>
        <h2>${c.name}</h2>
        <p class="en">${c.en}</p>
      </div>
      <span class="tag">${c.tag}</span>
      <button class="modal-close" aria-label="关闭窗口">✕</button>
    </div>

    <div class="modal-body">
      <section>
        <h4><span class="dot"></span>核心表现</h4>
        <ul class="signs">
          ${c.signs.map(s => `<li>${s}</li>`).join('')}
        </ul>
      </section>

      <section>
        <h4><span class="dot"></span>调整建议</h4>
        <ul class="tips">
          ${c.tips.map((t, i) => `
            <li>
              <span class="num">${i + 1}</span>
              <div>
                <b>${t.t}</b>
                <p>${t.d}</p>
              </div>
            </li>
          `).join('')}
        </ul>
      </section>

      ${c.alert ? `<div class="alert">${c.alert}</div>` : ''}
    </div>

    <div class="modal-foot">
      <button class="nav-btn" data-dir="-1">← 上一个</button>
      <span class="counter">${index + 1} / ${conditions.length}</span>
      <button class="nav-btn" data-dir="1">下一个 →</button>
    </div>
  `;
}

function openModal(index){
  currentIndex = (index + conditions.length) % conditions.length;
  const c = conditions[currentIndex];

  modal.style.setProperty('--accent', c.color);
  modal.innerHTML = modalHTML(c, currentIndex);

  modal.querySelector('.modal-close').addEventListener('click', closeModal);
  modal.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => openModal(currentIndex + Number(btn.dataset.dir)));
  });

  // 弹窗高光跟随（只在弹窗打开时绑定）
  if (enableGlow) {
    modal.addEventListener('pointermove', e => {
      const r = modal.getBoundingClientRect();
      modal.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      modal.style.setProperty('--my', (e.clientY - r.top) + 'px');
    }, { passive: true });
  }

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  overlay.classList.remove('open');
  document.body.style.overflow = '';
}

overlay.addEventListener('click', e => {
  if (e.target === overlay) closeModal();
});

document.addEventListener('keydown', e => {
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowRight') openModal(currentIndex + 1);
  if (e.key === 'ArrowLeft') openModal(currentIndex - 1);
});
</script>
</body>
</html>
